---
- name: Install Redis
  apt:
    name: redis-server
    state: present
    update_cache: yes

- name: Ensure Redis is started and enabled
  service:
    name: redis-server
    state: started
    enabled: yes

- name: Configure Redis to bind to all interfaces
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^bind 127\.0\.0\.1 ::1'
    line: 'bind 0.0.0.0'
  notify: restart redis
